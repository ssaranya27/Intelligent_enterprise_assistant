<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | EnterpriseAI</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body class="auth-body">

    <!-- BACKGROUND GLOW -->

    <div class="background-glow"></div>

    <!-- MAIN CONTAINER -->

    <div class="auth-container">

        <!-- LEFT SIDE -->

        <div class="auth-left">

            <div class="brand">

                <i class="fa-solid fa-robot"></i>

                <h1>EnterpriseAI</h1>

            </div>

            <h2>
                Welcome Back 👋
            </h2>

            <p>
                Access your AI-powered enterprise support dashboard
                and solve technical issues instantly using Mistral AI.
            </p>

            <div class="auth-features">

                <div class="feature-item">

                    <i class="fa-solid fa-shield-halved"></i>

                    <span>
                        Secure Authentication
                    </span>

                </div>

                <div class="feature-item">

                    <i class="fa-solid fa-brain"></i>

                    <span>
                        AI Powered Support
                    </span>

                </div>

                <div class="feature-item">

                    <i class="fa-solid fa-comments"></i>

                    <span>
                        Real-Time Assistance
                    </span>

                </div>

            </div>

        </div>

        <!-- RIGHT SIDE LOGIN CARD -->

        <div class="auth-card">

            <h2>Login</h2>

            <form method="POST">

                <!-- EMAIL -->

                <div class="input-group">

                    <i class="fa-solid fa-envelope"></i>

                    <input type="email"
                        name="email"
                        placeholder="Email Address"
                        required>

                </div>

                <!-- PASSWORD -->

                <div class="input-group">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                        name="password"
                        placeholder="Password"
                        required>

                </div>

                <!-- REMEMBER + FORGOT -->

                <div class="form-options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <!-- BUTTON -->

                <button type="submit">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>

            </form>

            <!-- BOTTOM TEXT -->

            <p class="bottom-text">

                Don't have an account?

                <a href="/register">
                    Register
                </a>

            </p>

        </div>

    </div>

</body>

</html>

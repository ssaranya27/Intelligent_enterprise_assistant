<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register | EnterpriseAI</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body class="auth-body">

    <!-- BACKGROUND GLOW -->

    <div class="background-glow"></div>

    <!-- MAIN CONTAINER -->

    <div class="auth-container">

        <!-- LEFT SIDE -->

        <div class="auth-left">

            <div class="brand">

                <i class="fa-solid fa-robot"></i>

                <h1>EnterpriseAI</h1>

            </div>

            <h2>
                Create Your Account 🚀
            </h2>

            <p>
                Join the next-generation AI enterprise support platform
                powered by Mistral AI for intelligent troubleshooting
                and real-time technical assistance.
            </p>

            <div class="auth-features">

                <div class="feature-item">

                    <i class="fa-solid fa-brain"></i>

                    <span>
                        AI Powered Assistance
                    </span>

                </div>

                <div class="feature-item">

                    <i class="fa-solid fa-lock"></i>

                    <span>
                        Secure User Authentication
                    </span>

                </div>

                <div class="feature-item">

                    <i class="fa-solid fa-bolt"></i>

                    <span>
                        Instant IT Support
                    </span>

                </div>

            </div>

        </div>

        <!-- RIGHT SIDE -->

        <div class="auth-card">

            <h2>Register</h2>

            <form method="POST">

                <!-- FULL NAME -->

                <div class="input-group">

                    <i class="fa-solid fa-user"></i>

                    <input type="text"
                        name="name"
                        placeholder="Full Name"
                        required>

                </div>

                <!-- EMAIL -->

                <div class="input-group">

                    <i class="fa-solid fa-envelope"></i>

                    <input type="email"
                        name="email"
                        placeholder="Email Address"
                        required>

                </div>

                <!-- PASSWORD -->

                <div class="input-group">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                        name="password"
                        placeholder="Password"
                        required>

                </div>

                <!-- BUTTON -->

                <button type="submit">

                    <i class="fa-solid fa-user-plus"></i>

                    Create Account

                </button>

            </form>

            <!-- BOTTOM TEXT -->

            <p class="bottom-text">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>

        </div>

    </div>

</body>

</html>
